<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impressum — Planagonia</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --paper: #f7f4ee;
    --paper-raised: #ffffff;
    --ink: #221f1c;
    --ink-soft: #5b5650;
    --line: #d8d2c6;
    --blue: #2c5f7c;
    --blue-deep: #1e4457;
    --amber: #b9791f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #191715;
      --paper-raised: #221f1c;
      --ink: #f1ece2;
      --ink-soft: #b5ada0;
      --line: #3a352c;
      --blue: #6fa6c4;
      --blue-deep: #8fbfda;
      --amber: #e0ab53;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #191715;
    --paper-raised: #221f1c;
    --ink: #f1ece2;
    --ink-soft: #b5ada0;
    --line: #3a352c;
    --blue: #6fa6c4;
    --blue-deep: #8fbfda;
    --amber: #e0ab53;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    line-height: 1.55;
  }
  h1, .wordmark { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  h1 { text-wrap: balance; letter-spacing: -0.01em; font-size: 1.6rem; margin: 0 0 1.8rem; }
  a { color: var(--blue-deep); }
  .wrap-chrome { max-width: 1080px; margin: 0 auto; padding: 0 1.5rem; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 1.5rem; }

  header.site {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.4rem 0;
  }
  .wordmark {
    font-size: 1.05rem; font-weight: 600; color: var(--ink); text-decoration: none;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .wordmark .dot { color: var(--amber); }
  nav.site a {
    color: var(--ink-soft); text-decoration: none; font-size: 0.92rem; margin-left: 1.75rem;
  }
  nav.site a:hover { color: var(--ink); }
  .nav-toggle { display: none; }

  main { padding: 2.5rem 0 4rem; }
  dl.card {
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 12px;
    padding: 1.5rem 1.7rem; margin: 0 0 1.6rem;
  }
  dl.card dt {
    font-family: "IBM Plex Mono", monospace; font-size: 0.74rem; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--ink-soft); margin-top: 1.1rem;
  }
  dl.card dt:first-child { margin-top: 0; }
  dl.card dd { margin: 0.2rem 0 0; }

  footer.site {
    padding: 2.5rem 0 3rem; color: var(--ink-soft); font-size: 0.86rem;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.7rem;
  }
  footer.site a { color: var(--ink-soft); }
  footer.site a:hover { color: var(--ink); }

  @media (max-width: 640px) {
    header.site { flex-wrap: wrap; row-gap: 0.7rem; }
    .nav-toggle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2.3rem; height: 2.3rem; border: 1px solid var(--line); border-radius: 7px;
      background: var(--paper-raised); color: var(--ink); font-size: 1.15rem; cursor: pointer;
    }
    nav.site { display: none; flex-basis: 100%; flex-direction: column; gap: 0.9rem; }
    nav.site.open { display: flex; }
    nav.site a { margin-left: 0; font-size: 1rem; }
    footer.site { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="wrap-chrome">
  <header class="site">
    <a class="wordmark" href="/"><span class="dot">▦</span> Planagonia</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">☰</button>
    <nav class="site" id="site-nav">
      <a href="/app/">Open the app</a>
      <a href="/docs/">Docs</a>
      <a href="/profile/">Profile</a>
    </nav>
  </header>
</div>
<script>
  (function () {
    var toggle = document.getElementById("nav-toggle");
    var nav = document.getElementById("site-nav");
    toggle.addEventListener("click", function () {
      var open = nav.classList.toggle("open");
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    });
  })();
</script>

<div class="wrap">
  <main>
    <h1>Impressum</h1>
    <dl class="card">
      <dt>Responsible for this site's content</dt>
      <dd>Tobias Minder</dd>
      <dt>Address</dt>
      <dd>Habsburgstrasse 18<br>8037 Zürich<br>Switzerland</dd>
      <dt>Contact</dt>
      <dd><a href="mailto:info@planagonia.com">info@planagonia.com</a></dd>
    </dl>
  </main>
</div>

<div class="wrap-chrome">
  <footer class="site">
    <span>Planagonia — a 2D plan generator.</span>
    <span><a href="/app/">Open the app</a> · <a href="/docs/">Docs</a> · <a href="/profile/">Profile</a></span>
  </footer>
</div>

</body>
</html>
