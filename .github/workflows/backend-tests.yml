name: Backend integration tests

# F-057: the account/auth/cloud-storage stack (storage-service-php/) had zero automated
# coverage -- every correctness claim rested on manual curl/live-browser checks recorded
# by hand in decisions.md. This spins up a real, throwaway WordPress + MySQL stack (the
# actual dependency, not a mock of it -- several real bugs this project hit live, like
# Application Passwords being server-generated-only or `user_login` being unchangeable,
# were WordPress's own behavior, which a mocked REST layer would never have surfaced) and
# runs the real PHP endpoints against it. CI-only, deliberately: no local PHP, MySQL, or
# Docker exists in this project's own dev environment, so this never runs on a dev
# machine -- only here, on push/PR, same as the existing frontend suite in tests.yml.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-integration:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      wordpress:
        image: wordpress:php8.2-apache
        env:
          WORDPRESS_DB_HOST: 127.0.0.1:3306
          WORDPRESS_DB_USER: root
          WORDPRESS_DB_PASSWORD: root
          WORDPRESS_DB_NAME: wordpress
          # Application Passwords (what every endpoint in this stack authenticates with,
          # D-019) refuse to work over plain HTTP unless the environment type is "local" --
          # confirmed WordPress core behavior (wp_is_application_passwords_available()),
          # not assumed. There's no real TLS in this disposable CI stack, so this is the
          # one WP-side config this test fixture needs beyond a stock install.
          WORDPRESS_CONFIG_EXTRA: "define('WP_ENVIRONMENT_TYPE', 'local');"
        ports:
          - 8081:80

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, curl, mbstring

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: storage-service-php/tests/requirements.txt

      - name: Install Python test dependencies
        run: pip install -r storage-service-php/tests/requirements.txt

      - name: Create the storage service's own database
        run: mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS planagoniadb"

      - name: Wait for WordPress to answer
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8081/wp-login.php > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "WordPress never came up" >&2
          exit 1

      - name: Install wp-cli inside the WordPress container
        run: |
          container_id=$(docker ps -q --filter "ancestor=wordpress:php8.2-apache")
          echo "container_id=$container_id" >> "$GITHUB_ENV"
          docker exec "$container_id" bash -c "curl -sS -o /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar && chmod +x /usr/local/bin/wp"

      - name: Install WordPress and configure the bot-admin account
        run: |
          wp() { docker exec "$container_id" wp --path=/var/www/html --allow-root "$@"; }
          wp core install --url=http://127.0.0.1:8081 --title="Storage Service CI" \
            --admin_user=bot --admin_password=bot-admin-password-for-ci-only \
            --admin_email=bot@example.test --skip-email
          # config.example.php's own comment: plain permalinks route /wp-json/... to the
          # homepage instead of the REST API -- a real issue this project already found
          # live, not a theoretical one.
          wp rewrite structure "/%postname%/"
          wp rewrite flush --hard
          bot_app_password=$(wp user application-password create bot storage-service-ci --porcelain)
          echo "::add-mask::$bot_app_password"
          echo "BOT_APP_PASSWORD=$bot_app_password" >> "$GITHUB_ENV"

      - name: Write storage-service-php/app/config.local.php
        run: |
          session_secret=$(openssl rand -hex 48)
          cat > storage-service-php/app/config.local.php <<EOF
          <?php
          return [
              'session_secret' => '${session_secret}',
              'wp_url' => 'http://127.0.0.1:8081',
              'allowed_origins' => ['http://127.0.0.1:9000'],
              'db_host' => '127.0.0.1',
              'db_name' => 'planagoniadb',
              'db_user' => 'root',
              'db_password' => 'root',
              'bot_username' => 'bot',
              'bot_password' => '${BOT_APP_PASSWORD}',
              'site_url' => 'http://127.0.0.1:9000',
              'api_url' => 'http://127.0.0.1:8080',
              'mail_from' => 'noreply@example.test',
          ];
          EOF

      - name: Start the storage service (PHP's built-in server)
        run: |
          php -S 127.0.0.1:8080 -t storage-service-php/httpdocs > php-server.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null -w '' http://127.0.0.1:8080/session.php -X POST -d '{}'; then exit 0; fi
            sleep 1
          done
          echo "storage service never came up" >&2
          cat php-server.log >&2
          exit 1

      - name: Run the backend integration tests
        env:
          STORAGE_BASE_URL: http://127.0.0.1:8080
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_USER: root
          TEST_DB_PASSWORD: root
          TEST_DB_NAME: planagoniadb
        run: pytest storage-service-php/tests/ -v

      - name: Show storage service log on failure
        if: failure()
        run: cat php-server.log || true
