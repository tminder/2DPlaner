<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planagonia</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f4f2; color: #222;
    display: flex; flex-direction: column; overflow: hidden; }
  header { flex: 0 0 auto; display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 1rem;
    background: #fff; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
  header h1 { font-size: 1.05rem; margin: 0; margin-right: 0.5rem; white-space: nowrap; display: flex; align-items: center; gap: 0.4rem; }
  header h1 a { color: inherit; text-decoration: none; }
  header h1 a:hover { text-decoration: underline; }
  .beta-badge { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    color: #8a6a1f; background: #f2dfb8; border-radius: 4px; padding: 0.15rem 0.4rem; }
  header .spacer { flex: 1; }
  button, select { font: inherit; font-size: 0.85rem; padding: 0.4rem 0.7rem; border: 1px solid #ccc;
    border-radius: 5px; background: #fff; cursor: pointer; }
  button:hover, select:hover { background: #f0f0f0; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:hover { background: #fff; }
  #undo-btn, #redo-btn { padding: 0.4rem 0.6rem; font-size: 1rem; line-height: 1; }
  /* Desktop: invisible to layout, so every button inside is just a normal flex item of
     header exactly as before — this wrapper only starts doing anything at the mobile
     breakpoint below. */
  .toolbar-more { display: contents; }
  .toolbar-toggle, .mobile-tabs { display: none; }

  /* main/.layout fill exactly the viewport height left after the header — nothing here
     should ever make the page itself scroll. Both panes stretch to that full height;
     min-height/min-width: 0 on every flex link in the chain is required, not decorative —
     without it a flex child won't shrink below its content's natural size, which is exactly
     how a page ends up scrolling despite "flex: 1" looking like it should prevent that. */
  main { flex: 1 1 auto; min-height: 0; padding: 1rem; display: flex; }
  .layout { display: flex; gap: 1rem; flex: 1 1 auto; min-height: 0; width: 100%; }
  textarea { flex: 0 0 420px; height: 100%; font-family: ui-monospace, Consolas, monospace; font-size: 13px;
    padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; resize: none; }
  /* position: relative anchors .status-overlay below — kept here in the page's own CSS
     (not left to the interactivity module) since error display is core, not module,
     behavior and must still work with no module loaded at all. */
  .viewer-pane { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0; position: relative; }
  /* Fills the whole pane now that .status-overlay below no longer reserves its own row —
     this is what makes the viewer reach exactly as far down as the textarea beside it. */
  #plan-root { flex: 1 1 auto; min-height: 0; display: flex; }
  /* The SVG's own width/height attributes (set by render(), meters * M) give it an
     intrinsic size — overridden here so it fills #plan-root instead. viewBox still defines
     its internal coordinate system, so this only changes the on-screen scale, not the plan;
     see the drag handler in interactivity-module.js for why that scale has to be accounted
     for there too, not just here. */
  #plan-root svg { width: 100%; height: 100%; display: block; background: #fff;
    border: 1px solid #ccc; border-radius: 6px; }

  svg .obj { transition: filter 0.1s; touch-action: none; }
  .anchor-hit { fill: transparent; touch-action: none; }
  svg .annotation text { pointer-events: none; font-family: system-ui, sans-serif; }
  svg .annotation[data-show="hover"] { opacity: 0; transition: opacity 0.15s; }
  svg .obj:hover + .annotation[data-show="hover"] { opacity: 1; }

  /* Overlaid on top of the viewer instead of a reserved row below it — each line only
     takes visual space when it actually has something to say (the :empty rule), so an
     idle viewer never loses height to a status bar with nothing in it. Capped width and a
     right-hand margin keep it clear of the interactivity module's Fit button (top-right);
     explicit z-index puts it above that button and the scale bar regardless. */
  .status-overlay { position: absolute; left: 0.5rem; top: 0.5rem; z-index: 3;
    max-width: min(520px, calc(100% - 4.5rem));
    display: flex; flex-direction: column; gap: 0.35rem; pointer-events: none; }
  .status-overlay > div:empty { display: none; }
  #error { color: #fff; background: #c0392b; white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; padding: 0.4rem 0.6rem; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  #dragmsg { color: #333; background: rgba(255,255,255,0.92); white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; padding: 0.3rem 0.55rem; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
  #modlog { color: #366; background: rgba(255,255,255,0.92); white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace;
    font-size: 11px; padding: 0.3rem 0.55rem; border-radius: 6px; opacity: 0.9; }

  #file-input { display: none; }

  /* Desktop-first: the two-pane code+viewer split (D-006), the always-visible toolbar,
     and its button sizing are all the default and stay unchanged above this width. Below
     it: the toolbar's rarely-needed actions collapse behind one "more" toggle instead of
     wrapping the header across several rows of full-size buttons, and the two panes
     become tabs — showing both panes at once, even stacked, leaves neither one tall
     enough to be usable — rather than a redesign of either. */
  @media (max-width: 760px) {
    header { padding: 0.4rem 0.5rem; gap: 0.4rem; }
    button, select { font-size: 0.78rem; padding: 0.32rem 0.55rem; }
    .saved-note { display: none; } /* the toolbar's own least essential line, cut first */
    header .spacer { display: none; }

    .toolbar-toggle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2rem; height: 2rem; padding: 0; font-size: 1.05rem; line-height: 1;
    }
    .toolbar-more {
      display: none; flex-basis: 100%; flex-direction: column; align-items: stretch; gap: 0.35rem;
    }
    .toolbar-more.open { display: flex; }
    .toolbar-more button, .toolbar-more select { width: 100%; }

    .mobile-tabs { display: flex; gap: 0.4rem; padding: 0.5rem 0.5rem 0; background: #fff; border-bottom: 1px solid #ddd; }
    .tab-btn {
      flex: 1 1 0; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px 6px 0 0;
      border-bottom: none; background: #f0f0f0; font: inherit; font-size: 0.82rem; cursor: pointer;
    }
    .tab-btn.active { background: #fff; font-weight: 600; }

    main { padding: 0.5rem; }
    .layout { flex-direction: column; }
    /* Only the active tab's pane is shown at all, so it gets the whole remaining height —
       no percentage split needed the way the earlier two-pane-stacked version needed one. */
    textarea, .viewer-pane, #code-highlight-wrap { flex: 1 1 auto; min-height: 0; width: 100%; height: auto; }
    .layout[data-mobile-tab="code"] .viewer-pane { display: none; }
    /* Hides the bare textarea when code-highlight-module.js hasn't loaded, and its
       wrapper (#code-highlight-wrap, D-042) when it has — the module moves the real
       textarea inside that wrapper at runtime, so hiding just the textarea itself would
       still leave the wrapper's own colored backdrop <pre> sibling, and the flex space
       it occupies, on screen. */
    .layout[data-mobile-tab="viewer"] textarea,
    .layout[data-mobile-tab="viewer"] #code-highlight-wrap { display: none; }
  }

  .cookie-notice {
    position: fixed; left: 1rem; right: 1rem; bottom: 1rem; z-index: 20;
    max-width: 640px; margin: 0 auto;
    background: #fff; border: 1px solid #ccc; border-radius: 10px;
    padding: 0.9rem 1.1rem; box-shadow: 0 6px 24px rgba(0,0,0,0.18);
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  }
  .cookie-notice[hidden] { display: none; }
  .cookie-notice p { margin: 0; font-size: 0.85rem; color: #555; flex: 1 1 20rem; }
  .cookie-notice button { flex: 0 0 auto; }

  /* Fixed placement (fine on a normally-scrolling page) has no safe spot on this one:
     the active tab's pane now fills 100% of the space below the header, so a fixed
     notice — top, bottom, wherever — sits directly on top of it and silently absorbs
     every touch meant for the plan or the toolbar underneath, confirmed the hard way by
     testing an actual drag through it rather than assumed from a screenshot. Taken out
     of `position: fixed` entirely instead, right here: `order: -1` puts it first in
     body's own flex column regardless of its DOM position (after </main>, unchanged, so
     it stays last for screen-reader/keyboard order — dismissing it isn't the first thing
     a keyboard user should be steered to). header/.mobile-tabs/main then push down to
     make room for it the same way any ordinary flex item would, and reclaim that space
     the instant `hidden` removes it — no overlap possible, nothing to calculate. */
  @media (max-width: 760px) {
    .cookie-notice {
      position: static; order: -1; max-width: none; margin: 0;
      border-radius: 0; border-width: 0 0 1px 0; box-shadow: none;
      padding: 0.6rem 0.7rem; gap: 0.6rem;
    }
    .cookie-notice p { font-size: 0.8rem; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="https://www.planagonia.com/" title="Back to planagonia.com">Planagonia</a> <span class="beta-badge">Beta</span></h1>
  <select id="plan-switcher"></select>
  <button id="undo-btn" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
  <button id="redo-btn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
  <button class="toolbar-toggle" id="toolbar-toggle" aria-label="More actions" aria-expanded="false" aria-controls="toolbar-more">⋯</button>
  <div class="toolbar-more" id="toolbar-more">
    <button id="rename-btn" title="Rename the current plan">Rename…</button>
    <button id="delete-btn" title="Delete the current plan">Delete</button>
    <button id="open-btn">Import…</button>
    <button id="save-btn">Export…</button>
    <button id="export-png-btn" title="Save the current plan as a PNG image">Export PNG…</button>
    <button id="export-svg-btn" title="Save the current plan as an SVG image">Export SVG…</button>
    <input type="file" id="file-input" accept=".planagon,.2dplan,.txt,text/plain">
    <button id="cloud-signin-btn" title="Sign in to save/load plans in the cloud">Sign in…</button>
    <span id="cloud-status" style="font-size: 0.8rem; color: #888;"></span>
    <button id="cloud-save-btn" title="Save the current plan to the cloud" hidden>Save to Cloud</button>
    <button id="cloud-signout-btn" title="Sign out" hidden>Sign out</button>
  </div>
  <div class="spacer"></div>
  <span class="saved-note" style="font-size: 0.8rem; color: #888;">Saved automatically in this browser</span>
</header>
<div class="mobile-tabs">
  <button class="tab-btn" id="tab-code" data-tab="code">Code</button>
  <button class="tab-btn active" id="tab-viewer" data-tab="viewer">Viewer</button>
</div>
<main>
  <div class="layout" id="layout" data-mobile-tab="viewer">
    <textarea id="source" spellcheck="false"></textarea>
    <div class="viewer-pane">
      <div id="plan-root"></div>
      <div class="status-overlay">
        <div id="error"></div>
        <div id="dragmsg"></div>
        <div id="modlog"></div>
      </div>
    </div>
  </div>
</main>

<div id="cookie-notice" class="cookie-notice" hidden>
  <p>This site saves your plans and sign-in state using your browser's own local storage — no tracking, no third-party cookies.</p>
  <button id="cookie-notice-dismiss">Got it</button>
</div>
<script>
  (function () {
    var KEY = "planagonia:cookieNoticeDismissed";
    var el = document.getElementById("cookie-notice");
    try { if (!localStorage.getItem(KEY)) el.hidden = false; } catch (e) { el.hidden = false; }
    document.getElementById("cookie-notice-dismiss").addEventListener("click", function () {
      el.hidden = true;
      try { localStorage.setItem(KEY, "1"); } catch (e) { /* private mode — not fatal */ }
    });
  })();
</script>

<script>
  // Mobile-only chrome: a "more actions" toggle for the toolbar's rarely-needed buttons,
  // and code/viewer tabs in place of the always-both-visible desktop layout. Both are
  // no-ops above the 760px breakpoint (the toggle and tabs are display:none there, and
  // .layout's data-mobile-tab attribute has nothing to select against) — this script
  // only ever changes what's shown, never anything the rest of the app's own logic reads.
  (function () {
    var toolbarToggle = document.getElementById("toolbar-toggle");
    var toolbarMore = document.getElementById("toolbar-more");
    toolbarToggle.addEventListener("click", function () {
      var open = toolbarMore.classList.toggle("open");
      toolbarToggle.setAttribute("aria-expanded", open ? "true" : "false");
    });

    var layout = document.getElementById("layout");
    var tabButtons = document.querySelectorAll(".tab-btn");
    tabButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        layout.dataset.mobileTab = btn.dataset.tab;
        tabButtons.forEach(function (b) { b.classList.toggle("active", b === btn); });
      });
    });
  })();
</script>

<script>
// ---------- Example plans ----------
const EXAMPLES = {
  blank: `settings {
  version: 1
}

element plan {
  shape: "rect"
  size: [4m, 3m]
  position: [0m, 0m]
  style: { fill: "#f7f5f0", stroke: "#333", strokeWidth: 0.04 }
}
`,
  apartment: `settings {
  version: 1
  allowSelfIntersectingPolygons: false
}

element room {
  shape: "rect"
  size: [5m, 4m]
  position: [0m, 0m]
  style: { fill: "#f7f5f0", stroke: "#333", strokeWidth: 0.04 }
  childPlacement: "inside"

  element corner_1 { position: [0m, 0m] }
  element corner_2 { position: [2.2m, 0m] }
  element corner_3 { position: [3.1m, 0m] }
  element corner_4 { position: [5m, 0m] }

  element wall_a {
    shape: "polyline"
    points: [corner_1, corner_2]
    style: { stroke: "#444", strokeWidth: 0.1 }
  }
  element door {
    shape: "polyline"
    points: [corner_2, corner_3]
    style: { stroke: "#8a6a42", strokeWidth: 0.1, strokeDash: "0.15,0.1" }
    label: "Tür"
    show: "hover"
  }
  element wall_b {
    shape: "polyline"
    points: [corner_3, corner_4]
    style: { stroke: "#444", strokeWidth: 0.1 }
  }

  element bed {
    shape: "rect"
    size: [1.6m, 2m]
    position: [0.3m, 0.4m]
    style: { fill: "#cfe0f5", stroke: "#4a76a8", strokeWidth: 0.02 }
    label: "Bett"
    show: "hover"
  }

  element desk {
    shape: "rect"
    size: [1.2m, 0.6m]
    position: [3.6m, 0.2m]
    style: { fill: "#fbe3b0", stroke: "#a87a2b", strokeWidth: 0.02 }
    label: "Schreibtisch"
    show: "hover"
  }

  element side_table {
    shape: "circle"
    radius: 0.35m
    position: [2.5m, 3.3m]
    style: { fill: "#bfe3f5", stroke: "#3a7a9a", strokeWidth: 0.03 }
    label: "Tisch"
    show: "always"
    dimensions: true
  }

  element stove {
    shape: "rect"
    size: [0.6m, 0.6m]
    position: [4.1m, 2.6m]
    style: { fill: "#d9534f", stroke: "#8a2f2a", strokeWidth: 0.02 }
    label: "Herd"
    show: "hover"
  }

  element counter {
    shape: "rect"
    size: [0.5m, 1.2m]
    position: [4.1m, 1.4m]
    style: { fill: "#e8c896", stroke: "#a9895c", strokeWidth: 0.02 }
    label: "Ablage"
    show: "hover"
  }

  element rug {
    shape: "polygon"
    points: [[1m, 2.6m], [1.9m, 2.5m], [2.1m, 3.4m], [1.5m, 3.9m], [0.7m, 3.5m]]
    style: { fill: "#e0d5c0", stroke: "#b0a080", strokeWidth: 0.02 }
    label: "Teppich"
    show: "hover"
  }
}

connection stove counter
`,
  utility: `settings {
  version: 1
  allowSelfIntersectingPolygons: false
}

element grundstueck {
  shape: "polygon"
  points: [[0m, 0m], [11m, 0m], [12m, 9m], [-1m, 9m]]
  style: { fill: "#dce8c8", stroke: "#7a9a5a", strokeWidth: 0.06 }
  label: "Grundstück"
  show: "hover"
  edgeLengths: true

  element haus {
    shape: "rect"
    size: [5.5m, 4m]
    position: [3m, 3m]
    style: { fill: "#e8d6b8", stroke: "#8a6a42", strokeWidth: 0.08 }
    label: "Haus"
    show: "always"
    dimensions: true
  }

  element haus_anschluss { position: [3m, 4.5m] }

  element stromanschluss {
    shape: "polyline"
    points: [[1.5m, 0.5m], [1.5m, 4.5m], haus_anschluss]
    style: { stroke: "#e0a800", strokeWidth: 0.05, strokeDash: "0.3,0.15" }
    label: "Stromanschluss"
    show: "hover"
  }
}

connection haus_anschluss haus
`,
};

// Display names for the plan switcher's "New from example…" group — kept separate from
// EXAMPLES' own keys since those are also used as (stable, never user-facing) identifiers.
const EXAMPLE_LABELS = { blank: "Blank", apartment: "Studio Apartment", utility: "Utility Connection" };

// None of the examples declare these themselves, so all three are added automatically if
// missing (see withAutoModules below) — every plan gets display (label/dimensions/edgeLengths),
// interaction (drag/select/connect), and a highlighted code pane for free, the same way
// core aim #1 intends, without every plan having to remember three module declarations.
// Order matters: annotations-module.js has to run first so its labels render like part of
// the base shapes, with interactivity's own icons/scale-bar/fit-button still ending up on
// top of them (D-039); code-highlight-module.js has to run after interactivity-module.js
// since it reads the selectedId signal interactivity's own render pass sets.
const AUTO_MODULES = ["annotations-module.js", "interactivity-module.js", "code-highlight-module.js"];

// ---------- Built-in ("internal") module registry — none shipped by default; a plan can
// still load its own via module "name.js" (external) or a bare internal name if one is
// registered here later. ----------
const INTERNAL_MODULES = {};

// ---------- Tokenizer ----------
const TOKEN_RE = /\s+|\/\/[^\n]*|"(?:[^"\\]|\\.)*"|\d+(?:\.\d+)?(?:cm|m)?\b|[A-Za-z_][A-Za-z0-9_]*|[{}\[\]():,.+\-*/]/y;
const KEYWORDS = new Set(["element", "module", "connection", "settings", "true", "false"]);
const PUNCT = { "{": "LBRACE", "}": "RBRACE", "[": "LBRACKET", "]": "RBRACKET",
  "(": "LPAREN", ")": "RPAREN", ":": "COLON", ",": "COMMA", ".": "DOT",
  "+": "PLUS", "-": "MINUS", "*": "STAR", "/": "SLASH" };

function tokenize(src) {
  const tokens = [];
  let i = 0;
  while (i < src.length) {
    TOKEN_RE.lastIndex = i;
    const m = TOKEN_RE.exec(src);
    if (!m || m.index !== i) throw new Error(`Unexpected character ${JSON.stringify(src[i])} at position ${i}`);
    const text = m[0];
    const start = i;
    i += text.length;
    if (/^\s+$/.test(text) || text.startsWith("//")) continue;
    if (text.startsWith('"')) {
      tokens.push({ type: "STRING", value: text.slice(1, -1), start, end: i });
    } else if (/^\d/.test(text)) {
      const unitMatch = text.match(/(cm|m)$/);
      const unit = unitMatch ? unitMatch[0] : "";
      const num = parseFloat(unit ? text.slice(0, -unit.length) : text);
      tokens.push({ type: "NUMBER", value: unit === "cm" ? num / 100 : num, unit, start, end: i });
    } else if (/^[A-Za-z_]/.test(text)) {
      tokens.push({ type: KEYWORDS.has(text) ? text.toUpperCase() : "IDENT", value: text, start, end: i });
    } else {
      tokens.push({ type: PUNCT[text], value: text, start, end: i });
    }
  }
  tokens.push({ type: "EOF", value: null, start: i, end: i });
  return tokens;
}

// ---------- Parser ----------
function parse(src) {
  const tokens = tokenize(src);
  const nodesById = {};
  let pos = 0;
  const peek = () => tokens[pos];
  const next = () => tokens[pos++];
  const expect = (type) => {
    if (peek().type !== type) throw new Error(`Expected ${type} but got ${peek().type} (${JSON.stringify(peek().value)})`);
    return next();
  };

  function parseProgram() {
    const modules = [];
    while (peek().type === "MODULE") { next(); modules.push(expect("STRING").value); }
    let settings = {};
    if (peek().type === "SETTINGS") { next(); settings = parseObjectLiteral(); }
    const root = parseElementDecl(null);
    const connections = [];
    while (peek().type !== "EOF") connections.push(parseConnectionDecl());
    return { root, nodesById, modules, settings, connections };
  }

  function parseElementDecl(parentId) {
    const startTok = expect("ELEMENT");
    const id = expect("IDENT").value;
    expect("LBRACE");
    const props = {};
    const children = [];
    while (peek().type !== "RBRACE") {
      if (peek().type === "ELEMENT") {
        children.push(parseElementDecl(id));
      } else {
        const key = expect("IDENT").value;
        expect("COLON");
        props[key] = parseValue();
      }
    }
    const endTok = expect("RBRACE");
    const node = { id, props, children, parentId, start: startTok.start, end: endTok.end };
    nodesById[id] = node;
    return node;
  }

  function parseConnectionDecl() {
    const startTok = expect("CONNECTION");
    const from = expect("IDENT").value;
    const toTok = expect("IDENT");
    let props = {};
    let endPos = toTok.end;
    if (peek().type === "LBRACE") {
      props = parseObjectLiteral();
      endPos = tokens[pos - 1].end;
    }
    return { from, to: toTok.value, props, start: startTok.start, end: endPos };
  }

  function parseValue() {
    if (peek().type === "LBRACKET") return parseArray();
    if (peek().type === "LBRACE") return parseObjectLiteral();
    if (peek().type === "STRING") return next().value;
    if (peek().type === "TRUE") { next(); return true; }
    if (peek().type === "FALSE") { next(); return false; }
    return parseExprValue();
  }

  function parseArray() {
    expect("LBRACKET");
    const items = [];
    while (peek().type !== "RBRACKET") {
      items.push(parseValue());
      if (peek().type === "COMMA") next(); else break;
    }
    expect("RBRACKET");
    return items;
  }

  function parseObjectLiteral() {
    expect("LBRACE");
    const obj = {};
    while (peek().type !== "RBRACE") {
      const key = expect("IDENT").value;
      expect("COLON");
      obj[key] = parseValue();
      if (peek().type === "COMMA") next();
    }
    expect("RBRACE");
    return obj;
  }

  function parseExprValue() {
    const ast = parseExpr();
    if (ast.type === "num" && !ast.compound) {
      return { value: ast.value, unit: ast.unit, start: ast.start, end: ast.end };
    }
    if (ast.type === "neg" && ast.value.type === "num" && !ast.value.compound) {
      return { value: -ast.value.value, unit: ast.value.unit, start: ast.start, end: ast.value.end };
    }
    if (containsPath(ast)) {
      const fn = (ctx) => evalAst(ast, ctx);
      fn.ast = ast;
      if (ast.type === "path" && ast.segments.length === 1) fn.cornerRef = ast.segments[0];
      return fn;
    }
    return evalAst(ast, null);
  }

  function parseExpr() {
    let node = parseTerm();
    while (peek().type === "PLUS" || peek().type === "MINUS") {
      const op = next().type;
      node = { type: "bin", op, left: node, right: parseTerm(), compound: true };
    }
    return node;
  }

  function parseTerm() {
    let node = parseFactor();
    while (peek().type === "STAR" || peek().type === "SLASH") {
      const op = next().type;
      node = { type: "bin", op, left: node, right: parseFactor(), compound: true };
    }
    return node;
  }

  function parseFactor() {
    if (peek().type === "MINUS") {
      const t = next();
      return { type: "neg", value: parseFactor(), compound: true, start: t.start };
    }
    if (peek().type === "LPAREN") { next(); const e = parseExpr(); expect("RPAREN"); return e; }
    if (peek().type === "NUMBER") {
      const t = next();
      return { type: "num", value: t.value, unit: t.unit, start: t.start, end: t.end };
    }
    if (peek().type === "IDENT") {
      // start/end weren't needed until Duplicate (F-016) had to find and rewrite a
      // corner-ref's own identifier in the source text — every other editable value
      // already tracked its span (D-009 onward), a bare path reference never had to.
      const startTok = peek();
      const segments = parsePath();
      const endTok = tokens[pos - 1];
      return { type: "path", segments, start: startTok.start, end: endTok.end };
    }
    throw new Error(`Expected a value, got ${peek().type}`);
  }

  function parsePath() {
    const segments = [expect("IDENT").value];
    while (peek().type === "DOT") { next(); segments.push(expect("IDENT").value); }
    return segments;
  }

  return parseProgram();
}

function containsPath(ast) {
  if (ast.type === "path") return true;
  if (ast.type === "neg") return containsPath(ast.value);
  if (ast.type === "bin") return containsPath(ast.left) || containsPath(ast.right);
  return false;
}

function evalAst(ast, ctx) {
  if (ast.type === "num") return ast.value;
  if (ast.type === "neg") return -evalAst(ast.value, ctx);
  if (ast.type === "bin") {
    const l = evalAst(ast.left, ctx), r = evalAst(ast.right, ctx);
    if (ast.op === "PLUS") return l + r;
    if (ast.op === "MINUS") return l - r;
    if (ast.op === "STAR") return l * r;
    if (ast.op === "SLASH") return l / r;
  }
  if (ast.type === "path") {
    let cur = ctx;
    for (const seg of ast.segments) {
      if (cur == null) throw new Error(`Cannot resolve '${ast.segments.join(".")}' — no value for '${seg}'`);
      if ((seg === "x" || seg === "y") && Array.isArray(cur)) cur = cur[seg === "x" ? 0 : 1];
      else cur = numOf(cur[seg]);
    }
    return numOf(cur);
  }
}

function numOf(v) {
  return v && typeof v === "object" && "value" in v && typeof v.value === "number" ? v.value : v;
}
function isEditable(v) { return v && typeof v === "object" && "start" in v; }

function linearize(ast) {
  if (ast.type === "num") return { coeff: 0, offset: ast.value };
  if (ast.type === "path") return { coeff: 1, offset: 0, segments: ast.segments };
  if (ast.type === "neg") {
    const v = linearize(ast.value);
    return v && { coeff: -v.coeff, offset: -v.offset, segments: v.segments };
  }
  if (ast.type === "bin") {
    const l = linearize(ast.left), r = linearize(ast.right);
    if (!l || !r) return null;
    const segments = l.segments || r.segments;
    if (ast.op === "PLUS") return { coeff: l.coeff + r.coeff, offset: l.offset + r.offset, segments };
    if (ast.op === "MINUS") return { coeff: l.coeff - r.coeff, offset: l.offset - r.offset, segments };
    if (ast.op === "STAR") {
      if (l.coeff !== 0 && r.coeff !== 0) return null;
      return { coeff: l.coeff * r.offset + r.coeff * l.offset, offset: l.offset * r.offset, segments };
    }
    if (ast.op === "SLASH") {
      if (r.coeff !== 0) return null;
      return { coeff: l.coeff / r.offset, offset: l.offset / r.offset, segments };
    }
  }
  return null;
}

function trySolveBackward(fn, parentNode, desiredValue, edits, warnings) {
  const lin = linearize(fn.ast);
  if (!lin || !lin.segments || lin.coeff === 0) {
    warnings.push("expression isn't a simple parent.<prop>.<x|y> +/-/*// chain, can't solve backward");
    return;
  }
  const [head, prop, axis] = lin.segments;
  if (head !== "parent" || (axis !== "x" && axis !== "y") || !parentNode) {
    warnings.push(`can't solve backward through '${lin.segments.join(".")}', only parent.<prop>.<x|y> is supported`);
    return;
  }
  const index = axis === "x" ? 0 : 1;
  const target = parentNode.props[prop]?.[index];
  if (!isEditable(target)) {
    warnings.push(`${parentNode.id}.${prop}.${axis} isn't a plain literal, can't rewrite it`);
    return;
  }
  const solvedValue = (desiredValue - lin.offset) / lin.coeff;
  edits.push({ start: target.start, end: target.end, text: formatNumber(solvedValue, target.unit) });
}

// ---------- Module loading. Cleanup-aware: a module removed from the plan's own module
// list gets its cleanup run and is evicted from the loaded cache, so re-declaring it later
// loads it fresh rather than leaving stale listeners/DOM behind. ----------
const loadedExternal = new Set();
const loadedInternal = new Set();
const moduleCleanups = new Map();
const declinedExternal = new Set();

function deactivateRemovedModules(currentModuleNames) {
  for (const [name, cleanup] of [...moduleCleanups]) {
    if (!currentModuleNames.includes(name)) {
      cleanup();
      moduleCleanups.delete(name);
      loadedExternal.delete(name);
      loadedInternal.delete(name);
      declinedExternal.delete(name);
    }
  }
}

function isUrlLike(name) { return name.includes("/") || name.endsWith(".js") || name.includes("://"); }

// The three modules this app ships and auto-injects itself (AUTO_MODULES) run with the
// same trust as core — a plan declaring exactly one of these by name never prompts, no
// matter how it was declared (auto-injected or written out explicitly). Anything else
// URL-like is code from wherever the plan's author (often an AI, D-003) pointed it,
// fetched and run with full page access and no sandboxing (D-020) — see project-overview.md's
// risk #2. Not solved here (no sandbox added, none is possible without a real trust
// model), just moved from "happens silently" to "a deliberate choice", asked once per
// session per URL — loadedExternal's existing dedup means this never re-prompts for a
// module already accepted this session.
function isTrustedModule(name) { return AUTO_MODULES.includes(name); }

function loadExternalScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = src;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error(`Failed to load module '${src}'`));
    document.body.appendChild(script);
  });
}

async function ensureModulesLoaded(moduleNames) {
  for (const name of moduleNames) {
    if (isUrlLike(name)) {
      if (declinedExternal.has(name)) {
        // Already asked and declined this session, and the plan still declares it
        // unchanged — re-asking on every keystroke (rerender runs on every edit) would
        // pop a native confirm() dialog while the user is mid-typing something unrelated
        // elsewhere in the plan. Stays declined until the line is actually removed and
        // re-added (deactivateRemovedModules clears this) or the page reloads.
        throw new Error(`Module '${name}' not loaded — declined earlier. Remove and re-add its module line to be asked again.`);
      }
      if (!loadedExternal.has(name)) {
        if (!isTrustedModule(name) && !confirm(
          `This plan wants to load code from an external module:\n\n${name}\n\n` +
          `Module code runs in this page with full access, unsandboxed. Only allow ` +
          `this if you trust where it came from.\n\nLoad it?`
        )) {
          declinedExternal.add(name);
          throw new Error(`Module '${name}' not loaded — declined.`);
        }
        await loadExternalScript(name);
        loadedExternal.add(name);
      }
    } else if (INTERNAL_MODULES[name]) {
      if (!loadedInternal.has(name)) {
        INTERNAL_MODULES[name]();
        loadedInternal.add(name);
      }
    } else {
      throw new Error(`Unknown internal module '${name}'`);
    }
  }
}

// ---------- Renderer (pure: parsed tree -> SVG string + rect bboxes; no selection/drag
// state of its own — that's the interactivity module's job, loaded like any other module). ----------
const M = 60; // meters -> px

function resolvePositionArray(props, parentProps) {
  const raw = props.position || [0, 0];
  return raw.map((v) => (typeof v === "function" ? v({ parent: parentProps }) : numOf(v)));
}

function computePositions(node, parent, offset, positions) {
  const [px, py] = resolvePositionArray(node.props, parent ? parent.props : null);
  const abs = [offset[0] + px, offset[1] + py];
  positions[node.id] = abs;
  for (const child of node.children) computePositions(child, node, abs, positions);
}

function computeCornerUsers(node, cornerUsers) {
  for (const pt of node.props.points ?? []) {
    if (typeof pt === "function" && pt.cornerRef) (cornerUsers[pt.cornerRef] ??= []).push(node.id);
  }
  for (const child of node.children) computeCornerUsers(child, cornerUsers);
}

function resolvePointAbs(pt, ownAbs, positions) {
  if (Array.isArray(pt)) return [ownAbs[0] + numOf(pt[0]), ownAbs[1] + numOf(pt[1])];
  if (typeof pt === "function" && pt.cornerRef) {
    const p = positions[pt.cornerRef];
    if (!p) throw new Error(`points reference to unknown element '${pt.cornerRef}'`);
    return p;
  }
  throw new Error("a points entry must be a [x,y] pair or a single sibling element id");
}

// F-027: `style` may be the usual inline object, or a plain string naming a preset defined
// in `settings { styles: { ... } }` — resolved here, once, right before use, rather than
// through the general expression system (which already has a real bug for this exact case,
// see open-questions.md F-027: an expression's own unevaluated value ends up as a literal,
// broken SVG attribute, since nothing before this ever anticipated one landing in `style`).
// An unknown preset name warns and falls back to no style, the same "surface it where the
// author is already looking" pattern this language already uses for other bad values
// (D-044/D-032's own unrecognized-placement warnings) rather than a hard parse error.
function resolveStyle(rawStyle, settings) {
  if (typeof rawStyle !== "string") return rawStyle;
  const preset = settings.styles && settings.styles[rawStyle];
  if (!preset) {
    console.warn(`style: "${rawStyle}" isn't defined in settings.styles — rendering with no style`);
    return {}; // not null: every branch below reads straight off this object
                // (style.fill, style.stroke, ...) — an empty object degrades to each
                // one's own existing "no color set" fallback, same as any shape that
                // simply left a style field out, rather than throwing on a null read.
  }
  return preset;
}

// Core renders geometry only — no label, dimensions, or edgeLengths text. Those are
// computed, read-only display facts about an element's own geometry, not required for the
// two core primitives themselves (D-038/D-039); annotations-module.js renders them by
// reading this same parsed/positioned tree back via window.PlanCore after core is done.
function renderShape(node, positions, cornerUsers, shapesOut, anchorsOut, bboxes, settings) {
  const ownAbs = positions[node.id];
  const { shape } = node.props;
  const style = resolveStyle(node.props.style, settings);
  // A declared-but-unresolvable style preset (F-027) must not fall through to the bare
  // anchor-point branch below the way a genuinely styleless corner-reference point does —
  // this checks whether a style was *declared at all* (still true even when resolution
  // above fell back to {}), not whether resolving it produced anything.
  const hasStyle = node.props.style !== undefined;
  const idAttr = `data-id="${node.id}"`;

  if (shape === "rect" && hasStyle) {
    const w = numOf(node.props.size[0]), h = numOf(node.props.size[1]);
    bboxes[node.id] = { left: ownAbs[0], top: ownAbs[1], right: ownAbs[0] + w, bottom: ownAbs[1] + h };
    shapesOut.push(`<rect class="obj" ${idAttr} pointer-events="all" x="${ownAbs[0]*M}" y="${ownAbs[1]*M}" width="${w*M}" height="${h*M}"
      fill="${style.fill ?? "none"}" stroke="${style.stroke ?? "none"}" stroke-width="${numOf(style.strokeWidth ?? 0.02)*M}" />`);
  } else if ((shape === "polyline" || shape === "polygon") && hasStyle) {
    const absPts = node.props.points.map((pt) => resolvePointAbs(pt, ownAbs, positions));
    const ptsStr = absPts.map(([x, y]) => `${x*M},${y*M}`).join(" ");
    const dashAttr = style.strokeDash ? `stroke-dasharray="${style.strokeDash.split(",").map(v => v*M).join(",")}"` : "";
    const tag = shape === "polygon" ? "polygon" : "polyline";
    shapesOut.push(`<${tag} class="obj" ${idAttr} pointer-events="all" points="${ptsStr}" fill="${style.fill ?? "none"}" stroke="${style.stroke}" stroke-width="${numOf(style.strokeWidth)*M}" ${dashAttr} />`);
  } else if (shape === "circle" && hasStyle) {
    const r = numOf(node.props.radius ?? 0.1);
    shapesOut.push(`<circle class="obj" ${idAttr} pointer-events="all" cx="${ownAbs[0]*M}" cy="${ownAbs[1]*M}" r="${r*M}"
      fill="${style.fill ?? "none"}" stroke="${style.stroke ?? "none"}" stroke-width="${numOf(style.strokeWidth ?? 0.02)*M}" />`);
  } else if (window.PlanModules && window.PlanModules[shape]) {
    shapesOut.push(window.PlanModules[shape](node, ownAbs, M, { numOf, idAttr }));
  } else {
    const users = (cornerUsers[node.id] || []).join(",");
    anchorsOut.push(`<circle class="anchor-hit" ${idAttr} data-corner-users="${users}" pointer-events="all" cx="${ownAbs[0]*M}" cy="${ownAbs[1]*M}" r="10" />`);
  }

  for (const child of node.children) renderShape(child, positions, cornerUsers, shapesOut, anchorsOut, bboxes, settings);
}

// Cached across renders, cleared unless the caller asks to preserve it (an in-progress drag
// re-renders repeatedly and must not have its own motion cancelled by an auto-refit camera).
let fixedViewBox = null;

function render(program) {
  const positions = {};
  computePositions(program.root, null, [0, 0], positions);
  const cornerUsers = {};
  computeCornerUsers(program.root, cornerUsers);
  const shapes = [], anchors = [], bboxes = {};
  renderShape(program.root, positions, cornerUsers, shapes, anchors, bboxes, program.settings);

  if (!fixedViewBox) {
    // A node's own position is only its *reference point* (top-left for a rect, own anchor
    // for a polygon/polyline) — never its size — so fitting purely to positions badly
    // undersizes any shape with no separate corner-anchor children marking out its own
    // extent. Every shipped example happens to have those (D-018's shared corners), so this
    // went unnoticed until a plan without them — the Blank example itself among them — was
    // actually rendered: a lone 4m×3m rect with no children fit to a box barely 1.4m
    // across. bboxes (already computed by renderShape, right above) covers rect; circle and
    // polygon/polyline still need their own extent folded in here.
    const pts = Object.values(positions);
    let minX = Math.min(...pts.map(p => p[0])), maxX = Math.max(...pts.map(p => p[0]));
    let minY = Math.min(...pts.map(p => p[1])), maxY = Math.max(...pts.map(p => p[1]));
    for (const b of Object.values(bboxes)) {
      minX = Math.min(minX, b.left); maxX = Math.max(maxX, b.right);
      minY = Math.min(minY, b.top); maxY = Math.max(maxY, b.bottom);
    }
    for (const node of Object.values(program.nodesById)) {
      if (node.props.shape === "circle" && node.props.radius) {
        const r = numOf(node.props.radius);
        const [cx, cy] = positions[node.id];
        minX = Math.min(minX, cx - r); maxX = Math.max(maxX, cx + r);
        minY = Math.min(minY, cy - r); maxY = Math.max(maxY, cy + r);
      } else if ((node.props.shape === "polygon" || node.props.shape === "polyline") && node.props.points) {
        for (const pt of node.props.points) {
          const [px, py] = resolvePointAbs(pt, positions[node.id], positions);
          minX = Math.min(minX, px); maxX = Math.max(maxX, px);
          minY = Math.min(minY, py); maxY = Math.max(maxY, py);
        }
      }
    }
    const pad = 0.7;
    minX -= pad; maxX += pad; minY -= pad; maxY += pad;
    fixedViewBox = { minX, minY, vw: (maxX - minX) * M, vh: (maxY - minY) * M };
  }
  const { minX, minY, vw, vh } = fixedViewBox;
  const out = [...shapes, ...anchors];
  return { svg: `<svg width="${vw}" height="${vh}" viewBox="${minX*M} ${minY*M} ${vw} ${vh}">${out.join("\n")}</svg>`, bboxes };
}

function formatNumber(value, unit) {
  const base = unit === "cm" ? value * 100 : value;
  const rounded = Math.round(base * 1000) / 1000;
  return `${rounded}${unit}`;
}

function connectedNodeIds(startId, connections) {
  const adj = {};
  for (const c of connections) {
    (adj[c.from] ??= []).push(c.to);
    (adj[c.to] ??= []).push(c.from);
  }
  const seen = new Set([startId]);
  const queue = [startId];
  while (queue.length) {
    for (const nb of adj[queue.shift()] ?? []) {
      if (!seen.has(nb)) { seen.add(nb); queue.push(nb); }
    }
  }
  seen.delete(startId);
  return [...seen];
}

function segmentsIntersect(p1, p2, p3, p4) {
  const d = (a, b, c) => (b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0]);
  const d1 = d(p3, p4, p1), d2 = d(p3, p4, p2), d3 = d(p1, p2, p3), d4 = d(p1, p2, p4);
  return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
}

function polygonSelfIntersects(pts) {
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const adjacent = j === (i + 1) % n || i === (j + 1) % n;
      if (adjacent) continue;
      if (segmentsIntersect(pts[i], pts[(i+1)%n], pts[j], pts[(j+1)%n])) return true;
    }
  }
  return false;
}

function checkRealism(nodeId, proposedXY, base, cornerUsers, settings) {
  if (settings.allowSelfIntersectingPolygons) return null;
  const users = cornerUsers[nodeId];
  if (!users) return null;

  const positions = {};
  computePositions(base.root, null, [0, 0], positions);
  positions[nodeId] = proposedXY;

  for (const userId of users) {
    const userNode = base.nodesById[userId];
    if (userNode.props.shape !== "polygon") continue;
    const pts = userNode.props.points.map((pt) => resolvePointAbs(pt, positions[userId], positions));
    if (polygonSelfIntersects(pts)) {
      return `${nodeId}: moving here would make '${userId}' self-intersecting. Set allowSelfIntersectingPolygons: true to allow this.`;
    }
  }
  return null;
}

function nodeDragEdits(node, parent, dx, dy, base, cornerUsers, warnings) {
  const edits = [];
  if (node.props.position) {
    const [x0, y0] = node.props.position;
    const parentCtx = { parent: parent ? parent.props : null };

    if (isEditable(x0) && isEditable(y0)) {
      const proposed = [x0.value + dx, y0.value + dy];
      const violation = checkRealism(node.id, proposed, base, cornerUsers, base.settings);
      if (violation) {
        warnings.push(violation);
      } else {
        edits.push({ start: x0.start, end: x0.end, text: formatNumber(proposed[0], x0.unit) });
        edits.push({ start: y0.start, end: y0.end, text: formatNumber(proposed[1], y0.unit) });
      }
    } else {
      if (isEditable(x0)) edits.push({ start: x0.start, end: x0.end, text: formatNumber(x0.value + dx, x0.unit) });
      else if (typeof x0 === "function") trySolveBackward(x0, parent, x0(parentCtx) + dx, edits, warnings);
      if (isEditable(y0)) edits.push({ start: y0.start, end: y0.end, text: formatNumber(y0.value + dy, y0.unit) });
      else if (typeof y0 === "function") trySolveBackward(y0, parent, y0(parentCtx) + dy, edits, warnings);
    }
  }

  if (node.props.points) {
    for (const pt of node.props.points) {
      if (Array.isArray(pt)) {
        const [x, y] = pt;
        if (isEditable(x)) edits.push({ start: x.start, end: x.end, text: formatNumber(x.value + dx, x.unit) });
        if (isEditable(y)) edits.push({ start: y.start, end: y.end, text: formatNumber(y.value + dy, y.unit) });
      } else if (typeof pt === "function" && pt.cornerRef) {
        warnings.push(`${node.id}: endpoint is pinned to '${pt.cornerRef}' — drag that corner directly to move it`);
      }
    }
  }
  return edits;
}

// ---------- Wire up ----------
const sourceEl = document.getElementById("source");
const rootEl = document.getElementById("plan-root");
const errorEl = document.getElementById("error");
const dragmsgEl = document.getElementById("dragmsg");
const modlogEl = document.getElementById("modlog");
let program = null;
const renderedCallbacks = [];

function logModule(msg) { modlogEl.textContent += `[module] ${msg}\n`; }

// ---------- Multiple named plans, persisted client-side (planning/project-overview.md's
// recommended first step before any backend: work out what shape "saved plans" actually
// needs locally, before a future storage service has to persist it). ----------
const PLANS_KEY = "2dplaner:plans";
const ACTIVE_PLAN_KEY = "2dplaner:activePlanId";
// The single-plan key this replaces (D-034) — read once at startup, purely to migrate an
// existing visitor's already-saved work into the new list rather than losing it; never
// written to again.
const LEGACY_STORAGE_KEY = "2dplaner:currentPlan";

function genPlanId() {
  return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

function savePlansList() {
  try { localStorage.setItem(PLANS_KEY, JSON.stringify(plans)); } catch (e) { /* private mode / quota — not fatal */ }
}

function loadPlansList() {
  try {
    const raw = localStorage.getItem(PLANS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* corrupt/unavailable storage — fall through to a fresh list */ }
  try {
    const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
    if (legacy) {
      const migrated = [{ id: genPlanId(), name: "My plan", text: legacy, updatedAt: Date.now() }];
      localStorage.setItem(PLANS_KEY, JSON.stringify(migrated));
      localStorage.removeItem(LEGACY_STORAGE_KEY);
      return migrated;
    }
  } catch (e) { /* private mode / quota — not fatal, just no migration */ }
  return [];
}

let plans = loadPlansList();
let activePlanId = null;
try { activePlanId = localStorage.getItem(ACTIVE_PLAN_KEY); } catch (e) { /* not fatal */ }
// Set while browsing an example with no active plan of its own — merely looking at one
// shouldn't clutter "My plans" with an entry nobody asked to keep. Turns into a real,
// saved plan (see rerender()) the moment its text actually changes, whether typed or
// dragged; switching away before that (to a real plan, a different example, a cloud
// plan) abandons it with nothing left behind.
let unsavedExample = null;

function activePlan() {
  return plans.find((p) => p.id === activePlanId) || null;
}

function setActivePlan(id) {
  activePlanId = id;
  try {
    if (id) localStorage.setItem(ACTIVE_PLAN_KEY, id);
    else localStorage.removeItem(ACTIVE_PLAN_KEY);
  } catch (e) { /* not fatal */ }
}

// Unique against every *other* plan's own current name — "Studio Apartment", then
// "Studio Apartment (2)" — rather than two indistinguishable entries in the switcher.
// excludeId lets a rename check against every plan except the one being renamed, so
// renaming a plan back to the name it already has isn't treated as a conflict with itself.
function uniquePlanName(base, excludeId) {
  const existing = new Set(plans.filter((p) => p.id !== excludeId).map((p) => p.name));
  if (!existing.has(base)) return base;
  let n = 2;
  while (existing.has(`${base} (${n})`)) n++;
  return `${base} (${n})`;
}

function createPlan(name, text) {
  const plan = { id: genPlanId(), name: uniquePlanName(name), text, updatedAt: Date.now() };
  plans.push(plan);
  savePlansList();
  return plan;
}

function switchToPlan(id) {
  const p = plans.find((x) => x.id === id);
  if (!p) return;
  unsavedExample = null;
  setActivePlan(id);
  sourceEl.value = p.text;
  resetUndoHistory(p.text);
  fixedViewBox = null;
  refreshPlanSwitcher();
  rerender();
}

function refreshPlanSwitcher() {
  const select = document.getElementById("plan-switcher");
  select.innerHTML = "";
  if (plans.length) {
    const savedGroup = document.createElement("optgroup");
    savedGroup.label = "My plans";
    for (const p of [...plans].sort((a, b) => b.updatedAt - a.updatedAt)) {
      const opt = document.createElement("option");
      opt.value = `plan:${p.id}`;
      opt.textContent = p.name;
      if (p.id === activePlanId) opt.selected = true;
      savedGroup.appendChild(opt);
    }
    select.appendChild(savedGroup);
  }
  const exampleGroup = document.createElement("optgroup");
  exampleGroup.label = "New from example…";
  for (const [key, label] of Object.entries(EXAMPLE_LABELS)) {
    const opt = document.createElement("option");
    opt.value = `example:${key}`;
    opt.textContent = label;
    if (!activePlanId && unsavedExample && unsavedExample.key === key) opt.selected = true;
    exampleGroup.appendChild(opt);
  }
  select.appendChild(exampleGroup);

  if (cloudToken()) refreshCloudGroup();
}

// ---------- Cloud sync (D-021/D-019), deliberately minimal: explicit save/load only, no
// automatic multi-device sync — localStorage stays the default, unaffected, source of
// truth. A signed-in session lets the active plan be explicitly pushed to the storage
// service (docs/'s own D-021), and a plan already saved there can be pulled into a new
// local plan via a third "Cloud" group in the existing plan-switcher, alongside "My
// plans" and "New from example" — reusing that UI rather than building a separate picker.
// The session token lives in sessionStorage (cleared when the tab closes), not
// localStorage — its own 1-hour server-side TTL means persisting it indefinitely would
// just mean "silently stale" more often, not meaningfully more convenient. ----------
const CLOUD_API_BASE = "https://api.planagonia.com";
const CLOUD_TOKEN_KEY = "planagonia:cloudToken";
const CLOUD_USERNAME_KEY = "planagonia:cloudUsername";

function cloudToken() {
  try { return sessionStorage.getItem(CLOUD_TOKEN_KEY); } catch (e) { return null; }
}
function setCloudSession(token, username) {
  try {
    if (token) {
      sessionStorage.setItem(CLOUD_TOKEN_KEY, token);
      sessionStorage.setItem(CLOUD_USERNAME_KEY, username);
    } else {
      sessionStorage.removeItem(CLOUD_TOKEN_KEY);
      sessionStorage.removeItem(CLOUD_USERNAME_KEY);
    }
  } catch (e) { /* private mode — cloud sign-in just won't persist across a reload */ }
}
function cloudUsername() {
  try { return sessionStorage.getItem(CLOUD_USERNAME_KEY); } catch (e) { return null; }
}

function updateCloudUi() {
  const signedIn = !!cloudToken();
  document.getElementById("cloud-signin-btn").hidden = signedIn;
  document.getElementById("cloud-save-btn").hidden = !signedIn;
  document.getElementById("cloud-signout-btn").hidden = !signedIn;
  document.getElementById("cloud-status").textContent = signedIn ? `Signed in as ${cloudUsername()}` : "";
}

async function cloudSignIn(username, password) {
  const res = await fetch(`${CLOUD_API_BASE}/session.php`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password }),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `Sign-in failed (${res.status})`);
  setCloudSession(body.token, username);
}

// Wraps fetch with the bearer token and a uniform "session expired" reaction — every
// cloud-authenticated call in this file goes through this, so that reaction only has to
// be written once.
async function cloudFetch(path, opts = {}) {
  const token = cloudToken();
  if (!token) throw new Error("Not signed in");
  const res = await fetch(`${CLOUD_API_BASE}${path}`, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}` },
  });
  if (res.status === 401) {
    setCloudSession(null, null);
    updateCloudUi();
    throw new Error("Cloud session expired — sign in again");
  }
  return res;
}

function showCloudMessage(msg) {
  dragmsgEl.textContent = `Cloud: ${msg}`;
}

// Creates a new cloud plan on first save; every save after that updates the same one,
// tracked via the local plan's own cloudId (an extra field alongside D-043's
// {id, name, text, updatedAt} — harmless to any code that doesn't know about it, since
// it's just carried along through JSON.stringify in savePlansList()).
async function saveActivePlanToCloud() {
  const p = activePlan();
  if (!p) return;
  try {
    const res = p.cloudId
      ? await cloudFetch(`/plans.php?id=${encodeURIComponent(p.cloudId)}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: p.name, text: p.text }),
        })
      : await cloudFetch(`/plans.php`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: p.name, text: p.text }),
        });
    if (!res.ok) throw new Error(`save failed (${res.status})`);
    const saved = await res.json();
    p.cloudId = saved.id;
    savePlansList();
    showCloudMessage(`saved "${p.name}".`);
    refreshCloudGroup();
  } catch (e) {
    showCloudMessage(`save failed — ${e.message}`);
  }
}

// Populates the plan-switcher's third optgroup from the cloud plan list. Separate from
// refreshPlanSwitcher() itself (which stays synchronous, matching the DOM's own
// synchronous rebuild of the other two groups) since this one needs a network round trip
// — called after sign-in, after a cloud save, and opportunistically whenever
// refreshPlanSwitcher() runs while already signed in.
async function refreshCloudGroup() {
  const select = document.getElementById("plan-switcher");
  select.querySelector('optgroup[label="Cloud"]')?.remove();
  let list;
  try {
    const res = await cloudFetch("/plans.php");
    if (!res.ok) throw new Error(`list failed (${res.status})`);
    list = (await res.json()).plans;
  } catch (e) {
    showCloudMessage(`couldn't load your cloud plans — ${e.message}`);
    return;
  }
  if (!list.length) return;
  const cloudGroup = document.createElement("optgroup");
  cloudGroup.label = "Cloud";
  for (const cp of list.sort((a, b) => b.updatedAt - a.updatedAt)) {
    const opt = document.createElement("option");
    opt.value = `cloud:${cp.id}`;
    opt.textContent = cp.name;
    cloudGroup.appendChild(opt);
  }
  select.appendChild(cloudGroup);
}

// Opening a cloud plan that's already linked to a local one (via cloudId, e.g. this
// browser was the one that saved it) switches to that local copy rather than importing a
// second, disconnected duplicate of the same plan.
async function openCloudPlan(cloudId) {
  const existing = plans.find((p) => p.cloudId === cloudId);
  if (existing) { switchToPlan(existing.id); return; }
  try {
    const res = await cloudFetch(`/plans.php?id=${encodeURIComponent(cloudId)}`);
    if (!res.ok) throw new Error(`load failed (${res.status})`);
    const cp = await res.json();
    const plan = createPlan(cp.name, withAutoModules(cp.text));
    plan.cloudId = cp.id;
    savePlansList();
    switchToPlan(plan.id);
  } catch (e) {
    showCloudMessage(`couldn't load that plan — ${e.message}`);
  }
}

// The error banner now overlays the viewer instead of living in a reserved status row (see
// .status-overlay), so it needs to clear itself rather than just getting silently pushed
// off-screen — otherwise a stale parse error from three edits ago would sit there forever.
let errorHideTimer = null;
function showError(msg) {
  errorEl.textContent = msg;
  clearTimeout(errorHideTimer);
  errorHideTimer = setTimeout(() => { errorEl.textContent = ""; }, 5000);
}

// ---------- Undo/redo (F-017) ----------
// A plain array of full source-text snapshots, not a diff/patch stack — this app's source
// text is small, and a linear history of "the text at each committed point" is simple to
// get right. Deliberately not layered on the textarea's own native undo: a drag or
// context-menu action mutates sourceEl.value directly (never a real keystroke), so the
// native stack never sees it at all — the one way to make it see them,
// document.execCommand("insertText", ...), requires the textarea to actually be focused,
// which on a touch device means the on-screen keyboard popping up on every single drag.
// Considered and rejected for exactly that reason (asked directly, confirmed before
// building either way) — this app's own mobile viewer (D-068) exists specifically so
// dragging doesn't need the keyboard anywhere near it. Cost of the plain-array approach
// instead: typed-edit undo granularity is "whatever the debounce below grouped," not the
// browser's own finer per-word heuristic.
const UNDO_CAP = 200;
let undoHistory = [];
let undoIndex = -1;

function resetUndoHistory(text) {
  undoHistory = [text];
  undoIndex = 0;
  updateUndoUi();
}

// The one commit point every edit source (a finished drag, a context-menu action, a
// debounced burst of typing) funnels through — pushes the *current* sourceEl.value as a
// new step, truncating any redo tail the way committing a fresh edit after an undo always
// does. A no-op if nothing actually changed since the last step, so e.g. a drag gesture
// that ends up moving nothing doesn't clutter history with a duplicate.
function commitUndoStep() {
  const text = sourceEl.value;
  if (text === undoHistory[undoIndex]) return;
  undoHistory = undoHistory.slice(0, undoIndex + 1);
  undoHistory.push(text);
  undoIndex++;
  if (undoHistory.length > UNDO_CAP) { undoHistory.shift(); undoIndex--; }
  updateUndoUi();
}

function undo() {
  if (undoIndex <= 0) return;
  undoIndex--;
  sourceEl.value = undoHistory[undoIndex];
  rerender({ preserveViewBox: true });
  updateUndoUi();
}

function redo() {
  if (undoIndex >= undoHistory.length - 1) return;
  undoIndex++;
  sourceEl.value = undoHistory[undoIndex];
  rerender({ preserveViewBox: true });
  updateUndoUi();
}

function updateUndoUi() {
  const undoBtn = document.getElementById("undo-btn");
  const redoBtn = document.getElementById("redo-btn");
  if (undoBtn) undoBtn.disabled = undoIndex <= 0;
  if (redoBtn) redoBtn.disabled = undoIndex >= undoHistory.length - 1;
}

// ---------- Module composition (D-011/F-002's third promise, D-046) ----------
// Every existing module hook runs *after* core has already rendered — fine for an
// overlay, useless for a module that needs to inject nodes the renderer itself should
// treat as first-class (a "wall with a door" expanding from a few parameters into the
// same corner/polyline structure a human would hand-author, D-018). registerBeforeRender
// callbacks run once per render, on the freshly-parsed tree, free to push synthesized
// nodes into any node's own `children` array before render() ever sees them — rendering
// itself needs zero composition-specific code, since a synthesized polyline flows through
// the exact same code path a typed one would.
// Returns an unsubscribe function, same shape as onRendered below — D-031's own lesson
// (module loading and module *activation* are different things once a module has state)
// applies here too: a composing module has to be able to stop expanding its composites
// once deactivated (D-045's deactivateRemovedModules), or its callback keeps running
// forever after the plan stops declaring it.
let beforeRenderCallbacks = [];
function registerBeforeRender(cb) {
  beforeRenderCallbacks.push(cb);
  return () => {
    const i = beforeRenderCallbacks.indexOf(cb);
    if (i !== -1) beforeRenderCallbacks.splice(i, 1);
  };
}

// parse() only ever indexes the nodes it actually parsed — a node a beforeRender callback
// pushes afterward needs nodesById rebuilt, or its own data-id (rendered exactly like any
// other element's, D-046) looks up to nothing the moment a click or drag tries to resolve
// it. Cheap to just walk the whole tree fresh rather than asking every composing module
// to maintain the map itself.
function reindexNodes(node, nodesById) {
  nodesById[node.id] = node;
  for (const child of node.children) reindexNodes(child, nodesById);
}

// Runs every registered beforeRender callback against an already-parsed program, then
// reindexes — the one place this pair of steps happens, so nothing ever calls one without
// the other. Deliberately *not* folded into parse() itself: parse() also has to run once,
// on its own, just to discover which modules a plan declares in the first place (module
// loading depends on that), before any of those modules' own beforeRender callbacks could
// possibly exist yet — expanding has to happen strictly after loading, never bundled into
// the same parse that's what triggers loading.
function expandTree(program) {
  for (const cb of beforeRenderCallbacks) cb(program);
  reindexNodes(program.root, program.nodesById);
  return program;
}

// What interactivity-module.js's own throwaway reparses (drag-in-progress,
// connect/disconnect snap) actually need: by the time any of those can run, whatever a
// plan declares has necessarily already loaded once (nothing to click or drag until a
// first real render happened) — so, unlike rerender() below, there's no module-loading
// race to worry about here, and parsing plus expanding can safely happen as one step.
function parseExpanded(text) {
  return expandTree(parse(text));
}

async function rerender(opts = {}) {
  const active = activePlan();
  if (active) {
    active.text = sourceEl.value; active.updatedAt = Date.now(); savePlansList();
  } else if (unsavedExample && sourceEl.value !== unsavedExample.text) {
    // First real change (typed or dragged) since the example was loaded — only now does
    // browsing it turn into a plan worth keeping.
    const plan = createPlan(unsavedExample.name, sourceEl.value);
    unsavedExample = null;
    setActivePlan(plan.id);
    refreshPlanSwitcher();
  }
  try {
    const parsed = parse(sourceEl.value);
    // D-034: every plan gets interactivity (and the other two shipped modules) by default,
    // regardless of whether its own text declares them — withAutoModules() only bakes that
    // guarantee into the text at specific entry points (new plan, load example/cloud plan),
    // so a plan that reached the editor any other way (typed or pasted directly, replacing
    // the whole source — the actual D-003 AI-copy-paste workflow) still needs it honored
    // here, on every render, not just at creation. Never rewrites the visible source text —
    // just what's kept active — so a deliberate edit to sourceEl.value is never second-guessed.
    const requiredModules = [...new Set([...AUTO_MODULES, ...parsed.modules])];
    deactivateRemovedModules(requiredModules);
    await ensureModulesLoaded(requiredModules);
    program = expandTree(parsed);
    if (!opts.preserveViewBox) fixedViewBox = null;
    const result = render(program);
    rootEl.innerHTML = result.svg;
    errorEl.textContent = "";
    clearTimeout(errorHideTimer);
    for (const cb of renderedCallbacks) cb(program, result);
    return result;
  } catch (e) {
    showError("Error: " + e.message);
  }
}

window.PlanCore = {
  parse, parseExpanded, render, tokenize,
  numOf, isEditable, formatNumber,
  computePositions, computeCornerUsers, resolvePointAbs, connectedNodeIds, nodeDragEdits,
  polygonSelfIntersects,
  rootEl, sourceEl, dragmsgEl, modlogEl,
  M,
  rerender,
  registerBeforeRender,
  commitUndoStep,
  onRendered: (cb) => {
    renderedCallbacks.push(cb);
    return () => {
      const i = renderedCallbacks.indexOf(cb);
      if (i !== -1) renderedCallbacks.splice(i, 1);
    };
  },
  registerModuleCleanup: (name, cleanupFn) => moduleCleanups.set(name, cleanupFn),
};

// ---------- Toolbar: plan switcher, rename/delete, open/save ----------
function hasModuleDeclared(text, filename) {
  const escaped = filename.replace(/\./g, "\\.");
  return new RegExp(`^\\s*module\\s+"[^"]*${escaped}"`, "m").test(text);
}

function withAutoModules(text) {
  const missing = AUTO_MODULES.filter((name) => !hasModuleDeclared(text, name));
  const prefix = missing.map((name) => `module "${name}"\n`).join("") + (missing.length ? "\n" : "");
  return prefix + text;
}

function newPlanFromExample(key) {
  const text = withAutoModules(EXAMPLES[key]);
  unsavedExample = { key, name: EXAMPLE_LABELS[key], text };
  setActivePlan(null);
  sourceEl.value = text;
  resetUndoHistory(text);
  fixedViewBox = null;
  refreshPlanSwitcher();
  rerender();
}

document.getElementById("plan-switcher").addEventListener("change", (e) => {
  const value = e.target.value;
  if (value.startsWith("plan:")) {
    switchToPlan(value.slice(5));
  } else if (value.startsWith("example:")) {
    const key = value.slice(8);
    if (!EXAMPLES[key]) return;
    newPlanFromExample(key);
  } else if (value.startsWith("cloud:")) {
    openCloudPlan(value.slice(6));
  }
});

document.getElementById("cloud-signin-btn").addEventListener("click", async () => {
  const username = prompt("Username:");
  if (!username) return;
  const password = prompt("Password (the one generated for you when you verified your email — not the one you chose when registering):");
  if (!password) return;
  try {
    await cloudSignIn(username.trim(), password.trim());
    updateCloudUi();
    showCloudMessage(`signed in as ${username.trim()}.`);
    refreshCloudGroup();
  } catch (e) {
    showCloudMessage(`sign-in failed — ${e.message}`);
  }
});

document.getElementById("cloud-signout-btn").addEventListener("click", () => {
  setCloudSession(null, null);
  updateCloudUi();
  refreshPlanSwitcher();
  showCloudMessage("signed out.");
});

document.getElementById("cloud-save-btn").addEventListener("click", () => saveActivePlanToCloud());

document.getElementById("rename-btn").addEventListener("click", () => {
  const p = activePlan();
  if (!p) return;
  const name = prompt("Rename plan:", p.name);
  if (name == null) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  p.name = uniquePlanName(trimmed, p.id);
  p.updatedAt = Date.now();
  savePlansList();
  refreshPlanSwitcher();
});

document.getElementById("delete-btn").addEventListener("click", () => {
  const p = activePlan();
  if (!p) return;
  if (!confirm(`Delete "${p.name}"? This can't be undone.`)) return;
  plans = plans.filter((x) => x.id !== p.id);
  savePlansList();
  if (plans.length) {
    const next = [...plans].sort((a, b) => b.updatedAt - a.updatedAt)[0];
    switchToPlan(next.id);
  } else {
    const fresh = createPlan(EXAMPLE_LABELS.apartment, withAutoModules(EXAMPLES.apartment));
    switchToPlan(fresh.id);
  }
});

document.getElementById("save-btn").addEventListener("click", () => {
  const p = activePlan();
  const blob = new Blob([sourceEl.value], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${(p ? p.name : "plan").replace(/[\\/:*?"<>|]+/g, "_")}.planagon`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

// ---------- Export as image (F-033) ----------
// The code-export above hands back the plan's *source*; this hands back a picture of it —
// a flattened PNG/SVG a person can drop straight into a document or chat, no editor needed
// to open it. Client-side only, same Blob+temporary-<a> download pattern as save-btn above.
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function exportFilename(ext) {
  const p = activePlan();
  return `${(p ? p.name : "plan").replace(/[\\/:*?"<>|]+/g, "_")}.${ext}`;
}

// A clone of the live SVG, not core's own bare render() — the live one already has
// annotations-module's labels/dimensions baked in (real plan content, belongs in an
// export) via its own onRendered hook, which a fresh render() call wouldn't have without
// re-running every module's render pass by hand. What gets stripped is specifically
// editor-only chrome a module added on top: the connect/disconnect icon buttons
// (interactivity-module, matched by their own data-action attribute) and interaction-state
// classes (selected/connected-highlight/corner-preview) — an export is a picture of the
// plan, not a screenshot of whatever happens to be selected or hovered in the editor right
// now. The scale bar, Fit button, and F-022's validation panel need no such stripping at
// all: they're plain HTML siblings of the <svg> inside #plan-root, never part of it.
function cleanSvgClone() {
  const liveSvg = rootEl.querySelector("svg");
  if (!liveSvg) return null;
  const clone = liveSvg.cloneNode(true);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  // Reset to the natural full-content fit regardless of whatever pan/zoom the live view
  // currently has applied (interactivity-module's own viewState overwrites the SVG's own
  // viewBox attribute for on-screen panning) — an export shows the whole plan, not
  // whichever fraction of it the editor's camera currently happens to be scrolled to.
  if (fixedViewBox) {
    const { minX, minY, vw, vh } = fixedViewBox;
    clone.setAttribute("viewBox", `${minX * M} ${minY * M} ${vw} ${vh}`);
    clone.setAttribute("width", vw);
    clone.setAttribute("height", vh);
  }
  clone.querySelectorAll("[data-action]").forEach((el) => el.remove());
  clone.querySelectorAll(".selected, .connected-highlight, .corner-preview, .stacked-hint")
    .forEach((el) => el.classList.remove("selected", "connected-highlight", "corner-preview", "stacked-hint"));
  // A "hover" annotation reads as invisible live only because the page's own stylesheet
  // (`.annotation[data-show="hover"] { opacity: 0 }`) says so — that rule lives in the
  // page's <style>, not in the SVG itself, so it has nothing to say once this clone is
  // serialized on its own and opened somewhere else. Found by actually opening an export
  // and seeing every hover label rendered at once, all overlapping — removed outright
  // (not just hidden via an inline style) rather than shipping invisible dead weight into
  // a file that has no hover interaction to reveal them with anyway.
  clone.querySelectorAll('.annotation[data-show="hover"]').forEach((el) => el.remove());
  return clone;
}

document.getElementById("export-svg-btn").addEventListener("click", () => {
  const clone = cleanSvgClone();
  if (!clone) return;
  const blob = new Blob([new XMLSerializer().serializeToString(clone)], { type: "image/svg+xml" });
  downloadBlob(blob, exportFilename("svg"));
});

document.getElementById("export-png-btn").addEventListener("click", () => {
  const clone = cleanSvgClone();
  if (!clone) return;
  const w = Number(clone.getAttribute("width")), h = Number(clone.getAttribute("height"));
  // A plain 1x raster of the SVG's own viewBox units tends to look soft once actually
  // opened at real size; 2x gives a noticeably crisper default without exposing a whole
  // resolution picker for a first cut of this feature.
  const SCALE = 2;
  const svgUrl = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)], { type: "image/svg+xml" }));
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = w * SCALE;
    canvas.height = h * SCALE;
    const ctx = canvas.getContext("2d");
    // A plan can have transparent gaps outside its own shapes (e.g. a polygon-only plan
    // with nothing covering its own bounding box) — a white backing matches how it already
    // reads inside the app's own light page background, rather than exporting a punch-hole
    // PNG that looks broken on a dark viewer elsewhere.
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(svgUrl);
    canvas.toBlob((blob) => downloadBlob(blob, exportFilename("png")), "image/png");
  };
  img.src = svgUrl;
});

const fileInput = document.getElementById("file-input");
document.getElementById("open-btn").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  fileInput.value = "";
  if (!file) return;
  const text = await file.text();
  const name = file.name.replace(/\.[^.]+$/, "") || "Imported plan";
  const plan = createPlan(name, withAutoModules(text));
  switchToPlan(plan.id);
});

// ---------- Startup: resume the last-active plan from this browser, or start fresh ----------
if (!plans.length) {
  const fresh = createPlan(EXAMPLE_LABELS.apartment, withAutoModules(EXAMPLES.apartment));
  activePlanId = fresh.id;
} else if (!activePlan()) {
  activePlanId = [...plans].sort((a, b) => b.updatedAt - a.updatedAt)[0].id;
}
setActivePlan(activePlanId);
sourceEl.value = activePlan().text;
resetUndoHistory(activePlan().text);
fixedViewBox = null;
updateCloudUi();
refreshPlanSwitcher();
rerender();

// Typing commits to undo history in debounced bursts (one step per pause, not per
// keystroke) rather than on every input event — matches how most editors group typed
// undo, and avoids a history entry for every single character. blur commits immediately
// (clearing any pending debounce) so clicking away from a quick, still-pending edit
// doesn't leave it stranded uncommitted.
let typingCommitTimer = null;
sourceEl.addEventListener("input", () => {
  rerender();
  clearTimeout(typingCommitTimer);
  typingCommitTimer = setTimeout(commitUndoStep, 600);
});
sourceEl.addEventListener("blur", () => {
  clearTimeout(typingCommitTimer);
  commitUndoStep();
});

document.getElementById("undo-btn").addEventListener("click", undo);
document.getElementById("redo-btn").addEventListener("click", redo);
document.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  const key = e.key.toLowerCase();
  if (key === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
  else if ((key === "z" && e.shiftKey) || key === "y") { e.preventDefault(); redo(); }
});
</script>
</body>
</html>
